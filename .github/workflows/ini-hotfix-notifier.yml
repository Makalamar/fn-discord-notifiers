name: Fortnite INI Hotfix Notifier

on:
  schedule:
    # Check every 5 minutes for new .ini hotfixes (fastest possible on free GitHub)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_latest:
        description: "Force notification of the most recent commit (even if already processed)"
        required: false
        default: false
        type: boolean
      notes:
        description: "Explications / Notes à ajouter manuellement (optionnel)"
        required: false
        type: string
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit & push the last_seen state file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false   # We will handle git auth ourselves for the push step

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run INI Hotfix Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes || '' }}
          EPIC_REFRESH_TOKEN: ${{ secrets.EPIC_REFRESH_TOKEN }}
        run: python scripts/ini_hotfix_notifier.py

      - name: Commit updated .ini files if any changes were detected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-authenticate for push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          if git diff --quiet last_cloudstorage/; then
            echo "No new .ini changes to commit."
          else
            git add last_cloudstorage/
            git commit -m "chore: update last known CloudStorage .ini files [skip ci]"
            git push
            echo "Updated .ini files committed."
          fi
