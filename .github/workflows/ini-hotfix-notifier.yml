name: Fortnite INI Hotfix Notifier

on:
  schedule:
    # Check every 5 minutes for new .ini hotfixes (fastest possible on free GitHub)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run INI Hotfix Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ini_hotfix_notifier.py

      - name: Commit state if new commits were processed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/last_ini_commit.json; then
            echo "No state changes."
          else
            git add data/last_ini_commit.json
            git commit -m "chore: update last seen INI commit [skip ci]"
            git push
            echo "State committed."
          fi
