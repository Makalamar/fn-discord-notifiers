name: Fortnite INI Hotfix Notifier (Dilly)

on:
  schedule:
    # Check every 5 minutes - fastest possible on GitHub free tier
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (affiche les messages sans les poster sur Discord)"
        required: false
        default: false
        type: boolean
      fortnite_version:
        description: "Numéro de version (ex: 4041). Laisser vide = détection automatique via l'API publique (recommandé)."
        required: false
        type: string
        default: ""
      notes:
        description: "Texte libre à ajouter à la fin du message Discord (optionnel). Laisse vide = rien n'est ajouté automatiquement. Tu pourras éditer le message Discord après coup pour mettre tes explications dans le format que tu veux."
        required: false
        type: string
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit state changes in last_cloudstorage/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run INI Hotfix Notifier (Dilly public mirror)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTES: ${{ github.event.inputs.notes || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run && '1' || '0' }}
          FORTNITE_VERSION: ${{ github.event.inputs.fortnite_version || '' }}
        run: python scripts/ini_hotfix_notifier.py

      - name: Write heartbeat timestamp (proves the 5min run)
        run: |
          mkdir -p data
          echo "Last check: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > data/last_check.txt
          echo "Workflow run completed successfully." >> data/last_check.txt

      - name: Commit updated .ini state + heartbeat (last_cloudstorage/ + data/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fix auth for push (required for github-actions[bot])
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # We must use -f because last_cloudstorage/*.ini are in .gitignore
          # (we only want them in the working tree during the run, not tracked normally)
          git add -f last_cloudstorage/ data/last_check.txt

          if git diff --cached --quiet; then
            echo "No changes to commit (should not happen with heartbeat)."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore: heartbeat ${TIMESTAMP} + ini state [skip ci]"
            git push
            echo "State + heartbeat committed successfully at ${TIMESTAMP}."
          fi

