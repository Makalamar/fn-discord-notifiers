name: Fortnite INI Hotfix Notifier (Dilly)

on:
  schedule:
    # Check every 5 minutes - fastest possible on GitHub free tier
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (affiche les messages sans les poster sur Discord)"
        required: false
        default: false
        type: boolean
      fortnite_version:
        description: "Numéro de version du jeu (ex: 4041). Laisser vide pour utiliser la valeur par défaut du script."
        required: false
        type: string
        default: ""
      notes:
        description: "Explications / Notes à ajouter manuellement (optionnel, visible dans le message Discord)"
        required: false
        type: string
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit state changes in last_cloudstorage/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run INI Hotfix Notifier (Dilly public mirror)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTES: ${{ github.event.inputs.notes || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run && '1' || '0' }}
          FORTNITE_VERSION: ${{ github.event.inputs.fortnite_version || '' }}
        run: python scripts/ini_hotfix_notifier.py

      - name: Commit updated .ini state (last_cloudstorage/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fix auth for push (required for github-actions[bot])
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          if git diff --quiet last_cloudstorage/; then
            echo "No .ini state changes to commit."
          else
            git add last_cloudstorage/
            git commit -m "chore: update last known .ini files from Dilly [skip ci]"
            git push
            echo "State committed."
          fi
