name: Fortnite Image/Video URL Notifier

on:
  schedule:
    # Check every 15 minutes for new image/video URLs in Fortnite news
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (affiche l'embed sans le poster sur Discord)"
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Image/Video URL Notifier
        env:
          DISCORD_IMAGE_URL_WEBHOOK_URL: ${{ secrets.DISCORD_IMAGE_URL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run && '1' || '0' }}
        run: python scripts/image_url_notifier.py

      - name: Commit notified image/video URLs state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git add -f data/notified_image_urls.json

          if git diff --cached --quiet; then
            echo "No new image/video URLs to record."
          else
            git commit -m "chore: update notified image/video URLs [skip ci]"
            git push
            echo "Image/video URLs state committed."
          fi
